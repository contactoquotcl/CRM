# Blueprint de Render: API + Postgres en planes GRATUITOS (para pruebas). Para producción sube a planes de pago.
databases:
  - name: quot-crm-db
    plan: free             # Postgres gratis de Render: se elimina a los 30 días (para pruebas)
    databaseName: quot_crm

services:
  - type: web
    name: quot-crm-api
    runtime: node
    rootDir: backend
    plan: free             # se "duerme" tras 15 min sin uso; el primer request tarda ~1 min. Con el chatbot en producción usa `starter` (ver docs/INTEGRACIONES.md §5)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quot-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false          # te lo pide Render al crear el blueprint
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false          # URL del frontend en Vercel, ej. https://quot-crm.vercel.app

      # --- Chatbot, WooCommerce y Chatwoot: los valores se cargan en el panel de Render (nunca en el repo) ---
      - key: CRM_PUBLIC_URL
        sync: false
      - key: CHATBOT_ALLOWED_ORIGINS
        value: https://quot.cl,https://www.quot.cl
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WC_BASE_URL
        sync: false
      - key: WC_CONSUMER_KEY
        sync: false
      - key: WC_CONSUMER_SECRET
        sync: false
      - key: WC_WEBHOOK_SECRET
        sync: false
      - key: CHATWOOT_BASE_URL
        sync: false
      - key: CHATWOOT_ACCOUNT_ID
        sync: false
      - key: CHATWOOT_API_TOKEN
        sync: false
      - key: CHATWOOT_INBOX_ID
        sync: false
      - key: CHATWOOT_WEBHOOK_SECRET
        sync: false
